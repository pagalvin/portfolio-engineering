services:
  postgres:
    image: postgres:17
    container_name: portfolio-engineering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_engineering_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_engineering_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
